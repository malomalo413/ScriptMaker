<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ScriptMaker Viewer</title>
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./css/viewer.css?v=28">
  <script src="./js/firebase-config.js?v=30" defer></script>
  <script src="./js/firebase-share.js?v=32" defer></script>
  <script src="./js/share-crypto.js?v=1" defer></script>
  <script src="./js/viewer.js?v=40" defer></script>
</head>
<body>
  <div id="viewerApp" class="viewer-app">
    <div id="viewerWallpaperA" class="viewer-wallpaper active"></div>
    <div id="viewerWallpaperB" class="viewer-wallpaper"></div>
    <header class="viewer-header">
      <div class="viewer-title-block">
        <p class="viewer-label">ScriptMaker Viewer</p>
        <h1 id="viewerTitle">台本</h1>
      </div>
      <div class="viewer-header-actions"><button id="viewerPdfButton" class="viewer-settings-button viewer-pdf-button hidden" type="button">PDFで保存</button><button id="viewerSpreadsheetButton" class="viewer-settings-button viewer-spreadsheet-button hidden" type="button">CSVダウンロード</button><button id="viewerExcelButton" class="viewer-settings-button viewer-spreadsheet-button hidden" type="button">Excelダウンロード</button><button id="viewerSettingsButton" class="viewer-settings-button" type="button" aria-haspopup="dialog">表示設定</button><button id="viewerLogoutButton" class="viewer-settings-button viewer-logout-button hidden" type="button">ログアウト</button></div>
    </header>
    <section class="viewer-display-mode-bar">
      <span>表示モード</span>
      <label><input type="radio" name="viewerDisplayMode" value="chat"> チャット型</label>
      <label><input type="radio" name="viewerDisplayMode" value="script"> 台本型</label>
      <span id="viewerOrientationHint" class="viewer-orientation-hint hidden">横画面で閲覧してください</span>
    </section>
    <section id="viewerCountPanel" class="viewer-count-panel hidden">
      <details id="viewerCountDetails">
        <summary><span>文字数</span><strong id="viewerCountTotal">合計文字数：0文字</strong></summary>
        <div class="viewer-count-options">
          <label class="viewer-count-check"><input id="viewerShowNumbers" type="checkbox" checked> <span>番号表示</span></label>
          <label class="viewer-count-check"><input id="viewerExcludeEmoji" type="checkbox"> <span>顔文字</span></label>
          <label class="viewer-count-field viewer-exclude-field"><span><input id="viewerUseExcludeChars" type="checkbox"> 除外する文字</span><input id="viewerExcludeChars" type="text" placeholder="例：、。！？"></label>
        </div>
        <div id="viewerCountBreakdown" class="viewer-count-breakdown"></div>
      </details>
    </section>
    <main id="viewerTimeline" class="viewer-timeline"></main>
    <div id="viewerPrintPages" class="viewer-print-pages" aria-hidden="true"></div>
    <div id="viewerEmpty" class="viewer-empty hidden">
      <h2>共有データがありません</h2>
      <p>Shareで作成したURLから開いてください。</p>
    </div>
    <div id="viewerSettingsPanel" class="viewer-settings-panel hidden" role="dialog" aria-modal="true" aria-labelledby="viewerSettingsTitle">
      <div class="viewer-settings-sheet">
        <div class="viewer-settings-head">
          <h2 id="viewerSettingsTitle">右側表示キャラクター</h2>
          <button id="viewerSettingsClose" class="viewer-icon-button" type="button" aria-label="close">&#215; </button>
        </div>
        <p class="viewer-settings-help">チェックしたキャラクターのセリフを右側に表示します。</p>
        <div class="viewer-settings-actions">
          <button id="viewerAllLeft" type="button">全員左側</button>
          <button id="viewerAllRight" type="button">全員右側</button>
          <button id="viewerUseEditor" type="button">編集側設定に戻す</button>
        </div>
        <div id="viewerCharacterOptions" class="viewer-character-options"></div>
        <div class="viewer-script-color-section">
          <h3>台本型のセリフ色</h3>
          <p>台本型で表示するキャラクターごとの色を選べます。</p>
          <div id="viewerScriptColorOptions" class="viewer-script-color-options"></div>
        </div>
      </div>
    </div>

    <div id="viewerAuthPanel" class="viewer-auth-panel hidden">
      <div class="viewer-auth-card">
        <p class="viewer-label">ScriptMaker Viewer</p>
        <h2>閲覧パスワード</h2>
        <p>この台本はパスワードで保護されています。</p>
        <input id="viewerPasswordInput" type="password" autocomplete="current-password" placeholder="パスワード">
        <button id="viewerPasswordSubmit" type="button">開く</button>
        <button id="viewerClearSavedPassword" class="viewer-secondary-button" type="button">保存したパスワードを削除</button>
        <div id="viewerPasswordMessage" class="viewer-auth-message"></div>
        <small>&#8251;GitHub Pages上の簡易保護です。</small>
      </div>
    </div>

  </div>
</body>
</html>
