<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ScriptMaker Share</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="./css/share.css?v=2">
  <script src="./js/share.js?v=2" defer></script>
</head>
<body>
  <main class="share-app">
    <header class="share-header">
      <div><p>ScriptMaker</p><h1>共有管理</h1></div>
      <a href="../Editor/">Editor</a>
    </header>
    <section class="share-panel">
      <h2>共有を作成</h2>
      <p>Editorのプロジェクトを閲覧専用Viewer向けのURLに変換します。</p>
      <div class="share-form">
        <select id="projectSelect"></select>
        <button onclick="createShare()">共有作成</button>
      </div>
    </section>
    <section class="share-panel">
      <h2>共有一覧</h2>
      <div id="shareList" class="share-list"></div>
    </section>
    <section class="share-panel muted">
      <h2>今後の拡張枠</h2>
      <ul><li>閲覧期限</li><li>パスワード</li><li>公開 / 非公開</li><li>コメント</li><li>読み終わったチェック</li></ul>
    </section>
  </main>
</body>
</html>
